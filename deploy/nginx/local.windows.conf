# Windows local integration test — paths filled by deploy/scripts/local_stack.ps1
#
# Serves:
#   http://localhost:8080/          → WebGL static (www/)
#   http://localhost:8080/api/health → Flask :5001

upstream smartcity_api_local {
    server 127.0.0.1:5001;
}

server {
    listen 8080;
    server_name localhost;

    root "__REPO_ROOT__/www";
    index index.html;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://smartcity_api_local/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # COOP/COEP required for Unity WebGL pthreads (SharedArrayBuffer).
    # Every location with add_header must repeat them (nginx does not inherit).
    location ^~ /Build/ {
        gzip off;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
        types {
            application/javascript  js;
            application/wasm        wasm;
            application/octet-stream data;
            application/json        json;
        }
        default_type application/octet-stream;
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/json;
}
