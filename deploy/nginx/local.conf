# Local integration test — repo-relative paths.
#
#   deploy/scripts/local_stack.sh
#
# Serves:
#   http://localhost:8080/          → WebGL static (www/)
#   http://localhost:8080/api/health → Flask via gunicorn :5001

upstream smartcity_api_local {
    server 127.0.0.1:5001;
}

server {
    listen 8080;
    server_name localhost;

    root "__REPO_ROOT__/www";
    index index.html;

    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://smartcity_api_local/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    gzip on;
    gzip_types application/javascript application/wasm text/css application/json;
}
