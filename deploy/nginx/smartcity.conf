# Production template — copy to /etc/nginx/sites-available/ and adjust paths.
#
#   sudo ln -s /opt/smartcity/repo/deploy/nginx/smartcity.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream smartcity_api {
    server 127.0.0.1:5001;
    keepalive 8;
}

server {
    listen 80;
    server_name smartcity.example.com;

    # WebGL build output (Unity Build → copy here)
    root /opt/smartcity/www;
    index index.html;

    # Flask API — /api/health → backend /health
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://smartcity_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unity WebGL SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Required when webGLThreadsSupport is enabled
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # Brotli/gzip can be enabled at http{} level
    gzip on;
    gzip_types application/javascript application/wasm text/css application/json;
}
