# Production template — copy to /etc/nginx/sites-available/ and adjust paths.
#
#   sudo ln -s /opt/smartcity/repo/deploy/nginx/smartcity.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream smartcity_api {
    server 127.0.0.1:5001;
    keepalive 8;
}

server {
    listen 80;
    server_name smartcity.example.com;

    # WebGL build output (Unity Build → copy here)
    root /opt/smartcity/www;
    index index.html;

    # Flask API — /api/health → backend /health
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://smartcity_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # COOP/COEP on every location that sets add_header (nginx does not inherit server headers).
    location ^~ /Build/ {
        gzip off;
        gzip_static on;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
        types {
            application/javascript  js;
            application/wasm        wasm;
            application/octet-stream data;
            application/json        json;
        }
        default_type application/octet-stream;
    }

    location = /index.html {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    location / {
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/json;
}
